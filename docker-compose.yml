services:
  smart-invest:
    build: .
    ports:
      - "3000:3000"
    environment:
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.deepseek.com}
      AI_MODEL: ${AI_MODEL:-deepseek-v4-flash}
      AI_TEMPERATURE: ${AI_TEMPERATURE:-0.2}
    restart: unless-stopped
